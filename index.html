function frUpdate(dt){if(!L||!L.ow||!WORLD)return null;frInit();const t0=performance.now();
  if(!FR.drawn&&P.dude&&P.dude.gun&&!VAN.on)equip(P.dude,null);

  if(FR.drawn&&FR.base){if(VAN.on)frHolster();else if(!baseArmOk())frHolster(baseLine('left')||FR_LINES.holster[0])}/* Fort Sensible: out of the training areas, the gun goes away */

  const inR=frInRiver();FR.diff=FR.diff||Object.assign({},AI.MISSION_DIFF[0]||AI.DIFFICULTY.normal);
  while(FR.noise.length&&simT-FR.noise[0].t>.5)FR.noise.shift();
  FR.alive=frAlive();FR.hostile=frHostiles();
  /* holster: car, leaving Riverside, 20 s of calm; the dad's gun stays out of sight while holstered */
  if(FR.drawn&&!FR.base){if(VAN.on)frHolster();else if(!inR)frHolster(FR_LINES.leftRiver);
    else{const calm=simT-FR.shotT>FR_TUNE.calmHolster&&simT-(FR.drawT||0)>FR_TUNE.calmHolster&&FR.heat<1&&!FR.hostile.some(e=>e.alert&&e.pos.distanceTo(P.pos)<40)&&!P.aim;if(calm)frHolster()}}
  if(inR&&FR.regionWas!=='river'){FR.incT=Math.max(FR.incT,20)}FR.regionWas=inR?'river':'other';
  /* the fight: nav window follows the dad while anyone is hostile */
  FR.fight=FR.hostile.length>0&&FR.hostile.some(e=>e.pos.distanceTo(P.pos)<70);
  if(FR.fight){frNav();FR.fightT=simT;FR.calmSince=simT}else if(FR.heat>0)FR.calmSince=simT;
  for(const s of FR.squads.values())s.update(dt,frWorld(frCrew(s.name)));

  if(FR.drawn&&inR)for(const g of FR.groups){if(g.kind==='incident'&&g.members.some(e=>e.frScript))continue;if(g.members.every(e=>e.hostile||e.state!=='idle'))continue;const dd=Math.hypot(g.x-P.pos.x,g.z-P.pos.z);

  frHeat(dt);if(FR.car)frCarStep(dt);
  if(inR&&!VAN.on||inR&&Math.abs((CV||VAN).spd)<12){FR.ambT=(FR.ambT||0)-dt;if(FR.ambT<=0&&FR.heat<1&&!FR.fight){FR.ambT=1;frAmbient()}}
  if(inR)frIncidentTick(dt);else if(FR.inc&&Math.hypot(FR.inc.x-P.pos.x,FR.inc.z-P.pos.z)>120)FR.inc=null;
  frCivTick(dt);
  /* thinning heals one step every 4 minutes; the turf-war scar heals over ~3 minutes */
  for(const c of FR_CREWS){const st=FR.crewState[c.id];if(st.thin>0&&simT-st.thinT>240){st.thin--;st.thinT=simT}}
  if(FR.war&&FR.warT>45&&FR.scar<20){FR.scar=Math.min(20,FR.scar+dt*.4)}else if(!FR.war&&FR.scar>0)FR.scar=Math.max(0,FR.scar-dt*.12);
  /* bookkeeping: deaths (trust), cleanup out of sight */
  for(const e of[...FR.members]){if(e.state==='dead'&&!e.frCounted){e.frCounted=true;e.deadT=simT;FR.stats.kills=(FR.stats.kills||0)+1;
      if(e.frBy==='player'){frTrust(-2,'Neutralized · that stays with you');FR.heat=Math.min(FR.cap,FR.heat+FR_TUNE.kill)}else if(e.frBy==='ally')frTrust(-1,'Neutralized');else HUD.feed(e.fr.short+' lost one','info')}
    const far=e.pos.distanceTo(P.pos),gone=(e.state==='dead'&&simT-e.deadT>25||e.state==='cuffed'&&simT-e.cuffT>20||e.leave&&far>35||e.state==='surrender'&&simT-e.surrAt>45||far>95&&!e.hostile||e.state==='idle'&&!inR&&far>60);
    if(gone&&(!frSeen(e.pos.x,e.pos.z)||far>95))frRemove(e)}

    if(near){prompt=KE+' · Zip-tie';if(useTap){useTap=false;frCuff(near)}}

    if(FR.drawn||FR.members.length||(L.pickups&&L.pickups.length)){const pk=updPickups(dt,!!prompt);if(pk){prompt=pk[0];pp=pk[1]}}}
  if(FR.inc&&FR.inc.kind==='porch'&&FR.inc.members[0]&&FR.inc.members[0].state==='cuffed')FR.lastPorch=FR.inc.porch;
  FR.stats.ms+=performance.now()-t0;FR.stats.frames++;return prompt?[prompt,pp]:null}
