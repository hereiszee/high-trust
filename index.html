/* Stage A kick-off (docs/PERF.md): fetch the asset manifest and the boot pack while three.js is still downloading.
   The ASSETS module picks these promises up; if anything here fails it falls back to loading files one by one. */

  B.webp=new Promise(r=>{const i=new Image();i.onload=()=>r(i.width===1);i.onerror=()=>r(false);i.src='data:image/webp;base64,UklGRiIAAABXRUJQVlA4IBYAAAAwAQCdASoBAAEADsD+JaQAA3AAAAAA'});
  const get=(u,prog,n=0)=>fetch(u).then(r=>{if(!r.ok){const e=new Error(u+' '+r.status);e.final=r.status<500;throw e}
      const rd=prog&&r.body&&r.body.getReader?r.body.getReader():null;
      if(!rd||!prog)return r.arrayBuffer();const parts=[];let got=0;
      const pump=()=>rd.read().then(({done,value})=>{if(done){const out=new Uint8Array(got);let o=0;for(const p of parts){out.set(p,o);o+=p.length}return out.buffer}

    .catch(e=>{if(n>=3||e.final)throw e;return new Promise(res=>setTimeout(res,800*Math.pow(2.5,n))).then(()=>get(u,prog,n+1))});

    return get(p.url,a=>B.onProgress&&B.onProgress(a,p.kb*1024))});
  B.pack.catch(()=>{});B.man.catch(()=>{});

  if('serviceWorker'in navigator&&location.protocol!=='file:')addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});
    navigator.serviceWorker.ready.then(r=>setTimeout(()=>{const u=[location.href.split('#')[0],...performance.getEntriesByType('resource').map(e=>e.name)].filter(x=>/^https?:/.test(x));
      if(r.active)r.active.postMessage({warm:[...new Set(u)]})},3000)).catch(()=>{})});
  return B})();
