/* Layout: full-bleed 3D view. The HUD, minimap and all menus come from js/hud.js + css/hud.css (window.HT.HUD). */
:root{
  --ink:#16181c; --paper:#f6f1e3; --sun:#ffc94a; --polo:#2f5d9e; --alarm:#e5533d; --leaf:#7ed36b;
  --display:"Bowlby One","Arial Black",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ui:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;

}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--paper);font-family:var(--body);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}

#tags,#sub{display:none}
@media (pointer:coarse){#lock{display:none}}
</style>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)], clamp=(v,a,b)=>v<a?a:v>b?b:v;
const V3=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const COARSE=matchMedia('(pointer:coarse)').matches,KE=COARSE?'USE':'E';

/* ================= RENDERER ================= */
/* filmic pipeline: PBR materials, ACES tone mapping, sRGB output; post effects are optional (Graphics setting) */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(1);renderer.autoClear=false;
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.domElement.id='c';renderer.domElement.tabIndex=0;document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(72,1,.05,420);camera.rotation.order='YXZ';scene.add(camera);
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();RENDER.resize()}
addEventListener('resize',()=>resize());
/* sun direction matches the sun in the sky panorama (late afternoon, ~48 degrees up) */
const SUN_DIR=V3(.55,.74,.38).normalize();
const hemi=new THREE.HemisphereLight(0xcfe3ff,0x6b5a40,.35);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff0d8,2.6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-28,right:28,top:28,bottom:-28,near:1,far:200});sun.shadow.bias=-.0004;sun.shadow.normalBias=.025;scene.add(sun);scene.add(sun.target);
const flash=new THREE.PointLight(0xffc070,0,9);scene.add(flash);
/* shadow camera follows a point ahead of the player, snapped to whole shadow texels so edges don't shimmer */
const _sx=new THREE.Vector3().crossVectors(V3(0,1,0),SUN_DIR).normalize(),_sy=new THREE.Vector3().crossVectors(SUN_DIR,_sx);
let shadowExt=28;
function sunFollow(x,z,fx=0,fz=0){x+=fx*shadowExt*.4;z+=fz*shadowExt*.4;const t=2*shadowExt/sun.shadow.mapSize.x,p=V3(x,0,z);
  const a=Math.round(p.dot(_sx)/t)*t,b=Math.round(p.dot(_sy)/t)*t,c=p.dot(SUN_DIR);
  sun.target.position.copy(_sx).multiplyScalar(a).addScaledVector(_sy,b).addScaledVector(SUN_DIR,c);sun.position.copy(sun.target.position).addScaledVector(SUN_DIR,90)}

const lin=c=>new THREE.Color(c).convertSRGBToLinear();
const matCache={};const mat=c=>matCache[c]||(matCache[c]=new THREE.MeshStandardMaterial({color:lin(c),roughness:.85,metalness:0}));
/* unlit glowing material: values above 1 survive into the HDR buffer and bloom */
const glowCache={};const glowMat=(c,k=2)=>glowCache[c+'|'+k]||(glowCache[c+'|'+k]=new THREE.MeshBasicMaterial({color:lin(c).multiplyScalar(k),toneMapped:false}));
const boxG=new THREE.BoxGeometry(1,1,1);
function box(w,h,d,c,x=0,y=0,z=0,parent){const m=new THREE.Mesh(boxG,mat(c));m.scale.set(w,h,d);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;if(parent)parent.add(m);return m}

/* ================= ASSETS ================= */
/* everything optional: any file that fails or is late leaves the procedural look in place */
const ASSETS=(()=>{
  const TEX=['asphalt','sidewalk','grass','brick','siding','roof','plaster','concfloor','woodfloor','metal','rustmetal','fence'];
  const CHARS=['dad_casual','dad_beard','dad_worker','thug_hoodie','thug_punk','boss_suit'];
  const PROPS={car_van:190,car_suv:220,car_sedan:185,car_hatchback:210,gun_pistol:57,gun_shotgun:40,gun_rifle:121,street_lamp:883,mailbox:17,trash_can:305,crate:84,crate_long:84,crate_slat:90,pallet:70,barrel_red:250,barrel_blue:189,couch:191,table_low:194,table_dining:203,trashbag:260,tyre:240,utility_box:279,cardboard_box:520,chest_wood:310,tree_oak:619,tree_tall:425,tree_pine:339,bush:164};
  const A={textures:{},gltfs:{},skyImg:null,skyTex:null,env:null,done:false,failed:[],progress:0};
  const items=[];let doneW=0,totalW=0,settled=0,resolveReady;
  A.ready=new Promise(r=>resolveReady=r);
  const listeners=[];A.onProgress=f=>listeners.push(f);
  const tick=()=>{let w=0;for(const it of items)w+=it.w*it.f;A.progress=totalW?w/totalW:1;listeners.forEach(f=>f(A.progress,A))};
  const finish=()=>{if(A.done)return;A.done=true;A.progress=1;listeners.forEach(f=>f(1,A));resolveReady(A)};
  function add(name,w,run){const it={name,w,f:0};items.push(it);totalW+=w;
    const ok=()=>{if(it.f===1&&it.settled)return;it.f=1;it.settled=true;settled++;tick();if(settled===items.length)finish()};
    const bad=e=>{if(it.settled)return;it.settled=true;it.f=1;settled++;A.failed.push(name);console.warn('asset failed, using fallback:',name);tick();if(settled===items.length)finish()};
    const prog=e=>{if(e&&e.lengthComputable&&e.total){it.f=Math.min(.98,e.loaded/e.total);tick()}};
    try{run(ok,bad,prog)}catch(e){bad(e)}}
  const aniso=()=>Math.min(8,renderer.capabilities.getMaxAnisotropy());
  const texLoader=new THREE.TextureLoader();
  function conf(t,srgb){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=aniso();if(srgb)t.encoding=THREE.sRGBEncoding;return t}
  for(const n of TEX){const set={};A.textures[n]=set;
    for(const[k,suf,srgb,w]of[['map','col',1,300],['normalMap','nrm',0,50],['roughnessMap','rgh',0,40],...(n==='fence'?[['alphaMap','alpha',0,260]]:[])])
      add('tex/'+n+'_'+suf,w,(ok,bad)=>{const t=conf(texLoader.load('assets/tex/'+n+'_'+suf+'.jpg',()=>{set[k]=t;ok()},undefined,bad),srgb)})}
  const gltfLoader=THREE.GLTFLoader?new THREE.GLTFLoader():null;
  const loadGltf=(name,url,w)=>add(name,w,(ok,bad,prog)=>{if(!gltfLoader)return bad();gltfLoader.load(url,g=>{
      g.scene.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});A.gltfs[name]=g;ok()},prog,bad)});
  for(const n of CHARS)loadGltf(n,'assets/chars/'+n+'.glb',n==='dad_casual'?1280:1200);
  for(const n in PROPS)loadGltf(n,'assets/props/'+n+'.glb',PROPS[n]);
  add('sky_2k',124,(ok,bad)=>{texLoader.load('assets/sky/sky_2k.jpg',t=>{t.encoding=THREE.sRGBEncoding;A.skyTex=t;A.skyImg=t.image;ok()},undefined,bad)});
  add('sky_1k.hdr',1435,(ok,bad,prog)=>{if(!THREE.RGBELoader)return bad();new THREE.RGBELoader().setDataType(THREE.UnsignedByteType).load('assets/sky/sky_1k.hdr',t=>{A.hdr=t;ok()},prog,bad)});
  setTimeout(()=>{if(!A.done){A.timedOut=true;for(const it of items)if(!it.settled)A.failed.push(it.name);console.warn('asset load timed out, continuing with fallbacks');finish()}},25000);
  /* getters for the rest of the game */
  A.tex=n=>{const s=A.textures[n];return s&&s.map?s:null};
  const pbrCache={};
  /* textured PBR material; opts: color (sRGB tint), roughness, metalness, normalScale, fallback (flat colour when the texture is missing), side, alphaTest */
  A.pbr=(n,o={})=>{const key=n+JSON.stringify(o);if(pbrCache[key])return pbrCache[key];const s=A.tex(n);
    const m=new THREE.MeshStandardMaterial({color:lin(o.color||(s?'#ffffff':(o.fallback||'#888888'))),roughness:o.roughness??1,metalness:o.metalness??0});
    if(s){m.map=s.map;if(s.normalMap){m.normalMap=s.normalMap;m.normalScale.setScalar(o.normalScale??1)}if(s.roughnessMap)m.roughnessMap=s.roughnessMap;
      if(s.alphaMap&&o.alpha!==false){m.alphaMap=s.alphaMap;m.alphaTest=o.alphaTest??.5;m.side=THREE.DoubleSide}}
    else if(o.roughness==null)m.roughness=.85;
    if(o.side!=null)m.side=o.side;return pbrCache[key]=m};
  /* unit box whose UVs tile at world scale (metres per repeat), for use with mesh.scale.set(w,h,d) like box() */
  const uvCache={};
  A.uvBox=(w,h,d,mpr=2)=>{const key=[w,h,d,mpr].map(v=>Math.round(v*100)).join('|');if(uvCache[key])return uvCache[key];
    const g=new THREE.BoxGeometry(1,1,1),uv=g.attributes.uv;const spans=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
    for(let f=0;f<6;f++)for(let i=0;i<4;i++){const k=f*4+i;uv.setXY(k,uv.getX(k)*spans[f][0]/mpr,uv.getY(k)*spans[f][1]/mpr)}
    return uvCache[key]=g};
  A.scaleUV=(g,su,sv=su)=>{const uv=g.attributes.uv;for(let i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)*su,uv.getY(i)*sv);uv.needsUpdate=true;return g};
  A.gltf=n=>A.gltfs[n]||null;
  /* independent copy of a model (skinned models get their own skeleton); materials are shared, clone before tinting */
  A.model=n=>{const g=A.gltfs[n];if(!g)return null;const c=THREE.SkeletonUtils?THREE.SkeletonUtils.clone(g.scene):g.scene.clone(true);return c};
  A.clips=()=>{const g=A.gltfs.dad_casual;return g?g.animations:[]};
  return A;
})();

/* ================= SKY + ENVIRONMENT ================= */
const skyMat=new THREE.MeshBasicMaterial({color:0xbfd8ef,side:THREE.BackSide,fog:false,toneMapped:false,depthWrite:false});
const skyDome=new THREE.Mesh(new THREE.SphereGeometry(380,48,24),skyMat);skyDome.scale.z=-1;skyDome.renderOrder=-10;skyDome.frustumCulled=false;scene.add(skyDome);
/* r128 ACES filmic curve, used to find fog colours that land exactly on the sky's horizon after tone mapping */
function aces(c,exp){const v=[c[0]*exp/.6,c[1]*exp/.6,c[2]*exp/.6];
  const i=[.59719*v[0]+.35458*v[1]+.04823*v[2],.07600*v[0]+.90834*v[1]+.01566*v[2],.02840*v[0]+.13383*v[1]+.83777*v[2]];
  const r=i.map(x=>(x*(x+.0245786)-.000090537)/(x*(.983729*x+.4329510)+.238081));
  return[1.60475*r[0]-.53108*r[1]-.07367*r[2],-.10208*r[0]+1.10813*r[1]-.00605*r[2],-.00327*r[0]-.07276*r[1]+1.07602*r[2]].map(x=>clamp(x,0,1))}
function unAces(t,exp){t=t.map(x=>clamp(x,0,.94));let f=t.slice();for(let k=0;k<80;k++){const o=aces(f,exp);for(let j=0;j<3;j++)f[j]=Math.max(0,f[j]+(t[j]-o[j])*(1+f[j]*2))}return f}
let skyHorizon=null;/* linear rgb of the panorama just above the horizon */
function sampleHorizon(img){try{const c=document.createElement('canvas');c.width=64;c.height=64;const x=c.getContext('2d');x.drawImage(img,0,0,64,64);
  const d=x.getImageData(0,28,64,3).data;let r=0,g=0,b=0,n=0;for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2];n++}
  skyHorizon=[r,g,b].map(v=>new THREE.Color(v/n/255,0,0).convertSRGBToLinear().r)}catch(e){skyHorizon=null}}
let envMap=null;const ENV_CLIP=4;
/* image-based light from the HDR sky; the panorama has no ground, so the lower half is darkened to a dirt/grass bounce first */
function buildEnv(){const pm=new THREE.PMREMGenerator(renderer);
  try{const h=ASSETS.hdr;
    if(h&&h.image&&h.image.data&&h.type===THREE.UnsignedByteType){const{width:W,height:H,data:D}=h.image;
      /* the sun disk is clipped too: the directional light already carries it, and leaving it in washes out every shadow */
      for(let y=0;y<H;y++){const below=(y-H/2)/(H*.04),k=clamp(below,0,1),gr=[.16,.15,.11];
        for(let x=0;x<W;x++){const o=(y*W+x)*4,s=Math.pow(2,D[o+3]-128)/255;let c=[D[o]*s,D[o+1]*s,D[o+2]*s];
          const pk=Math.max(c[0],c[1],c[2]);if(pk>ENV_CLIP)c=c.map(v=>v*ENV_CLIP/pk);
          if(k>0)c=c.map((v,j)=>v*(1-k)+v*gr[j]*k);const m=Math.max(c[0],c[1],c[2]);if(m<1e-6){D[o]=D[o+1]=D[o+2]=D[o+3]=0;continue}
          const e=Math.ceil(Math.log2(m)),sc=255/Math.pow(2,e);D[o]=Math.min(255,Math.round(c[0]*sc));D[o+1]=Math.min(255,Math.round(c[1]*sc));D[o+2]=Math.min(255,Math.round(c[2]*sc));D[o+3]=e+128}}
      h.needsUpdate=true;envMap=pm.fromEquirectangular(h).texture;h.dispose()}
    else if(ASSETS.skyTex){const t=ASSETS.skyTex.clone();t.mapping=THREE.EquirectangularReflectionMapping;t.needsUpdate=true;envMap=pm.fromEquirectangular(t).texture}
  }catch(e){console.warn('environment light failed',e);envMap=null}
  pm.dispose();scene.environment=envMap;if(typeof vmScene!=='undefined')vmScene.environment=envMap}
/* per-level lighting mood: sunny suburb, flat overcast for the dens, warm dusk for the kingpin */
const MOODS={
  sun:{exp:1,tint:'#ffffff',sun:'#fff0d8',si:2.1,hemi:.2,near:70,far:260,fb:'#bfd8ef'},
  over:{exp:.95,tint:'#c9d2db',sun:'#f4f1ea',si:1.5,hemi:.6,near:45,far:170,fb:'#9fb2c4'},
  dusk:{exp:.92,tint:'#ffbf8c',sun:'#ffb070',si:2.2,hemi:.4,near:50,far:200,fb:'#e9b88a'}};
let mood=MOODS.sun;
function setMood(def){mood=def.id==='hub'||def.type==='waves'?MOODS.sun:def.type==='boss'?MOODS.dusk:MOODS.over;applyMood()}
function applyMood(){const m=mood;renderer.toneMappingExposure=m.exp;sun.color.copy(lin(m.sun));sun.intensity=m.si;
  hemi.intensity=envMap?m.hemi:m.hemi+.6;const tint=lin(m.tint);
  if(ASSETS.skyTex){skyMat.map=ASSETS.skyTex;skyMat.color.copy(tint)}else skyMat.color.copy(lin(m.fb));skyMat.needsUpdate=true;
  let fog;if(skyHorizon){fog=unAces([skyHorizon[0]*tint.r,skyHorizon[1]*tint.g,skyHorizon[2]*tint.b],m.exp)}else{const c=lin(m.fb);fog=unAces([c.r,c.g,c.b],m.exp)}
  if(!scene.fog)scene.fog=new THREE.Fog(0,m.near,m.far);scene.fog.color.setRGB(fog[0],fog[1],fog[2]);scene.fog.near=m.near;scene.fog.far=m.far;scene.background=null}
ASSETS.ready.then(()=>{if(ASSETS.skyImg)sampleHorizon(ASSETS.skyImg);buildEnv();applyMood()});

/* ================= POST-PROCESSING ================= */
const POST_OK=!!(THREE.EffectComposer&&THREE.ShaderPass&&THREE.UnrealBloomPass&&THREE.CopyShader&&THREE.LuminosityHighPassShader&&THREE.FullScreenQuad);
const GFX={
  low:{pr:1,shadow:1024,soft:false,post:false,ext:26,label:'Fastest. No post effects, smaller shadows.'},
  med:{pr:1.25,shadow:2048,soft:true,post:true,ao:8,bloom:.5,ext:28,label:'AO, bloom, colour grade.'},
  high:{pr:2,shadow:4096,soft:true,post:true,ao:16,bloom:1,ext:34,label:'Everything, full resolution.'}};
const RENDER=(()=>{
  const R={post:false,q:'med',composer:null};
  let scenePass,bloom,grade,fxaa,bloomScale=.5;
  const FSV='varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}';
  const DEPTH='uniform sampler2D tDepth;uniform float cNear,cFar;uniform vec2 pS;'+
    'float zAt(vec2 uv){float d=texture2D(tDepth,uv).x;return 2.*cNear*cFar/(cFar+cNear-(d*2.-1.)*(cFar-cNear));}'+
    'vec3 pAt(vec2 uv){float z=zAt(uv);return vec3((uv*2.-1.)*z/pS,-z);}';
  /* screen-space ambient occlusion from the depth buffer alone (one scene render), at half resolution */
  const aoMat=new THREE.ShaderMaterial({defines:{SAMPLES:8},depthTest:false,depthWrite:false,
    uniforms:{tDepth:{value:null},cNear:{value:.05},cFar:{value:420},pS:{value:new THREE.Vector2(1,1)},texel:{value:new THREE.Vector2()},radius:{value:1},power:{value:4}},
    vertexShader:FSV,fragmentShader:'varying vec2 vUv;uniform vec2 texel;uniform float radius,power;'+DEPTH+`
    void main(){float d0=texture2D(tDepth,vUv).x;if(d0>=.9999){gl_FragColor=vec4(1.);return;}
      vec3 p=pAt(vUv);
      vec3 px=pAt(vUv+vec2(texel.x,0.)),nx=pAt(vUv-vec2(texel.x,0.)),py=pAt(vUv+vec2(0.,texel.y)),ny=pAt(vUv-vec2(0.,texel.y));
      vec3 dx=abs(px.z-p.z)<abs(nx.z-p.z)?px-p:p-nx,dy=abs(py.z-p.z)<abs(ny.z-p.z)?py-p:p-ny;
      vec3 n=normalize(cross(dx,dy));
      float z=-p.z;vec2 rUv=radius*pS*.5/z;float noise=fract(52.9829189*fract(dot(gl_FragCoord.xy,vec2(.06711056,.00583715))));
      float ao=0.;
      for(int i=0;i<SAMPLES;i++){float fi=float(i)+.5;float a=fi*2.39996+noise*6.2832;float r=sqrt(fi/float(SAMPLES));
        vec2 suv=vUv+vec2(cos(a),sin(a))*r*rUv;vec3 v=pAt(suv)-p;float vv=dot(v,v);
        ao+=max(0.,dot(v,n)-.012*z)/(vv+.03)*max(0.,1.-vv/(radius*radius*4.));}
      ao=clamp(1.-power*ao/float(SAMPLES),0.,1.);gl_FragColor=vec4(ao,ao,ao,1.);}`});
  /* composite: depth-aware blur of the AO, multiplied into the lit scene */
  const compMat=new THREE.ShaderMaterial({depthTest:false,depthWrite:false,
    uniforms:{tColor:{value:null},tAO:{value:null},tDepth:{value:null},cNear:{value:.05},cFar:{value:420},pS:{value:new THREE.Vector2(1,1)},aoTexel:{value:new THREE.Vector2()},strength:{value:.85},dbg:{value:0}},
    vertexShader:FSV,fragmentShader:'varying vec2 vUv;uniform sampler2D tColor,tAO;uniform vec2 aoTexel;uniform float strength,dbg;'+DEPTH+`
    void main(){vec4 c=texture2D(tColor,vUv);float z0=zAt(vUv);float s=0.,w=0.;
      for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){vec2 o=vec2(float(x),float(y))*aoTexel*1.5;float zz=zAt(vUv+o);float k=1./(1.+abs(zz-z0)*8./max(z0,.5));s+=texture2D(tAO,vUv+o).r*k;w+=k;}

  requestAnimationFrame(frame);
}
function start(){if(!ASSETS.done||mode!=='title')return;initAudio();HUD.hide('title');enterHub();canvasFocus();requestLock()}
RENDER.apply(CFG.gfx);
buildLevel(HUB);makePlayer();P.pos.copy(L.start);P.yaw=.4;P.pitch=-.12;
/* title card: progress bar while assets stream in; the button unlocks when everything settled (or after the 25s timeout) */
showTitle();
ASSETS.onProgress((f,A)=>{if(!A.done)HUD.set('title',{progress:f})});
ASSETS.ready.then(A=>{const miss=A.failed.length;
  HUD.set('title',{progress:1,ready:true,warn:!!miss,status:miss?(A.timedOut?'Slow connection · ':'')+miss+' file'+(miss>1?'s':'')+" didn't load · using the backyard look":'Ready'});
  if(mode==='title'){buildLevel(HUB);makePlayer();P.pos.copy(L.start)}
  if(HUD.screen==='title'){const b=document.querySelector('.ht-title [data-act=newgame]');if(b)b.focus({preventScroll:true})}});
window.__ht={assets:ASSETS,render:RENDER,P,get M(){return M},get L(){return L},get enemies(){return enemies},get allies(){return allies},prog,startMission,enterHub,keys,VAN,
  /* deterministic headless stepping without rendering */
  step(n,dt=1/30){for(let i=0;i<n&&running&&L;i++){simT+=dt;scene.updateMatrixWorld();(VAN.on?updVan:updPlayer)(dt);for(const e of enemies)updEnemy(e,dt);for(const a of allies)updAlly(a,dt);if(mode==='mission')updMission(dt);else if(mode==='hub')updHub(dt);useTap=false;updCamera(dt)}},
  set mouse(v){mouseDown=v},set use(v){useTap=v}};
requestAnimationFrame(frame);
})();
