<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buildings Test Street</title>
<style>
  :root { --bg: #c9d6e2; --fg: #111; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1b1f24; --fg: #eee; } }
  :root[data-theme="dark"] { --bg: #1b1f24; --fg: #eee; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
  #hud { position: fixed; left: 8px; top: 8px; background: rgba(0,0,0,.55); color: #fff; padding: 6px 10px; border-radius: 6px; max-width: calc(100vw - 32px); }
  #hud button { margin: 2px; }
</style>
</head>
<body>
<div id="hud">loading…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="../js/buildings.js"></script>
<script>
(() => {
'use strict';
const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, .1, 600);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
const lin = c => new THREE.Color(c).convertSRGBToLinear();
const SUN_DIR = new THREE.Vector3(.55, .74, .38).normalize();
const hemi = new THREE.HemisphereLight(0xcfe3ff, 0x6b5a40, .2); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d8, 2.1); sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -70, right: 70, top: 70, bottom: -70, near: 1, far: 300 }); sun.shadow.bias = -.0004; sun.shadow.normalBias = .03;
sun.position.copy(SUN_DIR).multiplyScalar(150); scene.add(sun, sun.target);

/* ASSETS shim: same tex()/pbr() API as the game loader, reading ../assets/tex */
const ASSETS = (() => {
  const A = { textures: {}, gltfs: {} }, L = new THREE.TextureLoader(), jobs = [];
  const conf = (t, srgb) => { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; if (srgb) t.encoding = THREE.sRGBEncoding; return t; };
  for (const n of ['brick', 'sidewalk', 'asphalt', 'grass', 'rustmetal', 'woodfloor', 'concfloor']) {
    const set = A.textures[n] = {};
    for (const [k, s, srgb] of [['map', 'col', 1], ['normalMap', 'nrm', 0], ['roughnessMap', 'rgh', 0]])
      jobs.push(new Promise(res => { const t = conf(L.load('../assets/tex/' + n + '_' + s + '.jpg', () => { set[k] = t; res(); }, undefined, () => res()), srgb); }));
  }
  const gl = new THREE.GLTFLoader();
  for (const n of ['tree_oak', 'tree_tall', 'bush', 'mailbox', 'street_lamp'])
    jobs.push(new Promise(res => gl.load('../assets/props/' + n + '.glb', g => { g.scene.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; } }); A.gltfs[n] = g; res(); }, undefined, () => res())));
  jobs.push(new Promise(res => new THREE.RGBELoader().setDataType(THREE.UnsignedByteType).load('../assets/sky/sky_1k.hdr', t => { A.hdr = t; res(); }, undefined, () => res())));
  jobs.push(new Promise(res => L.load('../assets/sky/sky_2k.jpg', t => { t.encoding = THREE.sRGBEncoding; A.skyTex = t; res(); }, undefined, () => res())));
  A.ready = Promise.all(jobs).then(() => A);
  A.tex = n => { const s = A.textures[n]; return s && s.map ? s : null; };
  const cache = {};
  A.pbr = (n, o = {}) => { const key = n + JSON.stringify(o); if (cache[key]) return cache[key]; const s = A.tex(n);
    const m = new THREE.MeshStandardMaterial({ color: lin(o.color || (s ? '#ffffff' : (o.fallback || '#888888'))), roughness: o.roughness ?? 1, metalness: o.metalness ?? 0 });
    if (s) { m.map = s.map; if (s.normalMap) { m.normalMap = s.normalMap; m.normalScale.setScalar(o.normalScale ?? 1); } if (s.roughnessMap) m.roughnessMap = s.roughnessMap; }
    if (o.side != null) m.side = o.side; return cache[key] = m; };
  A.scaleUV = (g, su, sv = su) => { const uv = g.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * su, uv.getY(i) * sv); uv.needsUpdate = true; return g; };
  A.model = n => { const g = A.gltfs[n]; return g ? g.scene.clone(true) : null; };
  return A;
})();

function buildEnv() {
  const pm = new THREE.PMREMGenerator(renderer), h = ASSETS.hdr;
  if (h && h.image && h.image.data) {
    const { width: W, height: H, data: D } = h.image, CLIP = 4;
    for (let y = 0; y < H; y++) { const k = Math.min(1, Math.max(0, (y - H / 2) / (H * .04))), gr = [.16, .15, .11];
      for (let x = 0; x < W; x++) { const o = (y * W + x) * 4, s = Math.pow(2, D[o + 3] - 128) / 255; let c = [D[o] * s, D[o + 1] * s, D[o + 2] * s];
        const pk = Math.max(...c); if (pk > CLIP) c = c.map(v => v * CLIP / pk); if (k > 0) c = c.map((v, j) => v * (1 - k) + v * gr[j] * k);
        const m = Math.max(...c); if (m < 1e-6) { D[o] = D[o + 1] = D[o + 2] = D[o + 3] = 0; continue; }
        const e = Math.ceil(Math.log2(m)), sc = 255 / Math.pow(2, e); D[o] = Math.min(255, Math.round(c[0] * sc)); D[o + 1] = Math.min(255, Math.round(c[1] * sc)); D[o + 2] = Math.min(255, Math.round(c[2] * sc)); D[o + 3] = e + 128; } }
    h.needsUpdate = true; scene.environment = pm.fromEquirectangular(h).texture;
  }
  if (ASSETS.skyTex) { const t = ASSETS.skyTex; t.mapping = THREE.EquirectangularReflectionMapping; scene.background = t; }
  pm.dispose();
}

const stats = [];
function ground() {
  const g = new THREE.Group();
  const tile = (name, w, d, mpr, x, y, z, col) => { const geo = new THREE.PlaneGeometry(w, d); ASSETS.scaleUV(geo, w / mpr, d / mpr); geo.rotateX(-Math.PI / 2);
    const m = new THREE.Mesh(geo, ASSETS.pbr(name, { color: col || '#ffffff' })); m.position.set(x, y, z); m.receiveShadow = true; g.add(m); return m; };
  { const gm = tile('grass', 400, 400, 3, 0, 0, 0, '#c8d0a8').material; gm.roughnessMap = null; gm.roughness = 1; gm.needsUpdate = true; }
  tile('asphalt', 240, 9, 4, 30, .02, 0);
  tile('sidewalk', 240, 1.6, 2, 30, .12, -6.3); tile('sidewalk', 240, 1.6, 2, 30, .12, 6.3);
  const curb = new THREE.BoxGeometry(240, .15, .18); for (const z of [-4.6, 4.6]) { const m = new THREE.Mesh(curb, ASSETS.pbr('concfloor', { color: '#d9d6cf' })); m.position.set(30, .075, z); m.receiveShadow = m.castShadow = true; g.add(m); }
  return { g, tile };
}

ASSETS.ready.then(() => {
  buildEnv();
  const HB = HT.Buildings.init({ assets: ASSETS, base: '../' });
  const { g: G, tile } = ground(); scene.add(G);
  const lot = 17;
  const houses = [
    { style: 'ranch', w: 13, d: 8, seed: 3 }, { style: 'colonial', w: 12, d: 8, seed: 11 }, { style: 'craftsman', w: 10, d: 9, seed: 7 }, { style: 'split', w: 12, d: 8, seed: 4 },
    { style: 'colonial', w: 14.5, d: 8.5, seed: 21, home: true }, { style: 'ranch', w: 11, d: 7, seed: 15 }, { style: 'craftsman', w: 11, d: 10, seed: 9 }, { style: 'ranch', w: 15, d: 8, seed: 33 }];
  const placed = [];
  houses.forEach((h, i) => {
    const north = i < 4, x = (i % 4) * lot, z = north ? -17 : 17;
    const grp = HB.house(Object.assign({ facing: north ? '+z' : '-z' }, h));
    grp.position.set(x, 0, z); scene.add(grp);
    const st = HB.stats(grp); stats.push(Object.assign({ name: h.style + (h.home ? '(home)' : '') + '#' + h.seed }, st)); placed.push(grp);
    /* front walk + driveway to the street */
    const ud = grp.userData; const dz = north ? 1 : -1;
    const fz = z + dz * (h.d / 2), walkTo = north ? -7.1 : 7.1;
    if (ud.driveway) { const dx = x + ud.driveway.x, z0 = z + ud.driveway.z; tile('concfloor', ud.driveway.w, Math.abs(walkTo - z0) + 1.5, 3, dx, .03, (z0 + (north ? -4.6 : 4.6)) / 2, '#d8d4cc'); }
    if (ud.doorStep) { const sx = x + ud.doorStep.x, sz = z + ud.doorStep.z; tile('sidewalk', 1.2, Math.abs(walkTo - sz), 2, sx, .04, (sz + walkTo) / 2); }
    const tr = ASSETS.model(i % 3 ? 'tree_oak' : 'tree_tall'); if (tr) { tr.position.set(x + (i % 2 ? -6.5 : 6.5), 0, north ? -8.6 : 8.6); tr.rotation.y = i; scene.add(tr); }
    for (let k = 0; k < 3; k++) { const bu = ASSETS.model('bush'); if (bu) { bu.position.set(x - h.w / 2 + 1.2 + k * 1.3, 0, fz + dz * .9); bu.scale.setScalar(.8); scene.add(bu); } }
    const mb = ASSETS.model('mailbox'); if (mb) { mb.position.set(x + (i % 2 ? 2.5 : -2.5), 0, north ? -5.2 : 5.2); mb.rotation.y = north ? 0 : Math.PI; scene.add(mb); }
  });
  /* commercial strip further down the road */
  const comm = [['shop', { kind: 'hardware', w: 18, d: 13, seed: 1 }], ['shop', { kind: 'auto', w: 17, d: 12, seed: 2 }], ['shop', { kind: 'store', w: 13, d: 11, seed: 3 }],
    ['shell', { kind: 'warehouse', w: 20, d: 14, h: 6.5, seed: 1 }], ['shell', { kind: 'duplex', w: 12, d: 8, seed: 2 }], ['shell', { kind: 'rowhouse', w: 16, d: 9, h: 9, seed: 3 }]];
  let cx = 72;
  comm.forEach(([fn, o], i) => {
    const north = i < 3, z = north ? -(6.3 + .8 + 2.6 + o.d / 2) : (6.3 + .8 + 3.2 + o.d / 2);
    const x = 78 + (i % 3) * 23;
    const grp = HB[fn](Object.assign({ facing: north ? '+z' : '-z' }, o)); grp.position.set(x, 0, z); scene.add(grp); placed.push(grp);
    stats.push(Object.assign({ name: fn + ':' + o.kind }, HB.stats(grp)));
    tile('concfloor', o.w + 2, 4, 3, x, .025, north ? z + o.d / 2 + 1.6 : z - o.d / 2 - 1.6, '#cfcbc3');
  });
  /* side-facing house to exercise +x/-x facing */
  const sideH = HB.house({ style: 'ranch', w: 8, d: 12, seed: 77, facing: '+x' }); sideH.position.set(-24, 0, -17); scene.add(sideH); stats.push(Object.assign({ name: 'ranch +x' }, HB.stats(sideH)));
  const sideH2 = HB.house({ style: 'split', w: 8, d: 12, seed: 78, facing: '-x' }); sideH2.position.set(-24, 0, 17); scene.add(sideH2); stats.push(Object.assign({ name: 'split -x' }, HB.stats(sideH2)));
  for (let i = 0; i < 9; i++) { const l = ASSETS.model('street_lamp'); if (l) { l.position.set(i * 17 - 8, 0, i % 2 ? 5.2 : -5.2); l.rotation.y = i % 2 ? Math.PI : 0; scene.add(l); } }

  /* debug: draw colliders + door markers when ?debug */
  if (q.has('debug')) for (const g of placed) { for (const c of g.userData.colliders) { const m = new THREE.Mesh(new THREE.BoxGeometry(c.x1 - c.x0, .3, c.z1 - c.z0), new THREE.MeshBasicMaterial({ color: 0xff00ff, wireframe: true })); m.position.set(g.position.x + (c.x0 + c.x1) / 2, .15, g.position.z + (c.z0 + c.z1) / 2); scene.add(m); }
    const d = g.userData.door; const m = new THREE.Mesh(new THREE.SphereGeometry(.2), new THREE.MeshBasicMaterial({ color: 0x00ffff })); m.position.set(g.position.x + d.x + d.nx * .3, 1, g.position.z + d.z + d.nz * .3); scene.add(m); }

  const V = {
    street: [[-6, 1.7, 5.6], [40, 2.8, -10]], street2: [[58, 1.7, -5.6], [10, 3, 8]], porch: [[-0.6, 1.7, 33.5], [0.6, 2.6, 21]],
    porch2: [[37.5, 1.7, -8.6], [34, 2.2, -12.5]], home: [[68, 2, 4.8], [68, 3, 17]], aerial: [[-10, 34, 40], [26, 0, 0]],
    shops: [[70, 1.8, 2.5], [96, 3, -14]], shells: [[70, 1.8, -2.5], [96, 3, 16]], window: [[16.6, 2.2, -10.6], [16.6, 2.0, -12.6]], side: [[-35, 3, -2], [-24, 2, -17]],
    rear: [[24, 9, -40], [24, 2, -17]], roof: [[-2, 6.5, -9.5], [0, 4, -17]] };
  let dirty = true;
  placed.forEach((g, i) => { const d = g.userData.door, wp = (x, y, z) => [g.position.x + x, y, g.position.z + z];
    V['p' + i] = [wp(d.x + d.nx * 15 + d.nz * 3, 1.7, d.z + d.nz * 15 - d.nx * 3), wp(0, 3, 0)];
    V['c' + i] = [wp(d.x + d.nx * 4.5 + d.nz * 1.5, 1.6, d.z + d.nz * 4.5 - d.nx * 1.5), wp(d.x, 1.6, d.z)]; });
  function setView(n) { const v = V[n] || V.street; camera.position.set(...v[0]); controls.target.set(...v[1]); controls.update(); dirty = true; }
  controls.addEventListener('change', () => dirty = true);
  setView(q.get('view') || 'street');
  if (q.has('night')) { HB.setNight(1); renderer.toneMappingExposure = .35; sun.intensity = .05; hemi.intensity = .03; for (const g of placed) for (const l of g.userData.lights) { const p = new THREE.PointLight(l.color, 2, l.distance, 2); p.position.set(g.position.x + l.x, l.y, g.position.z + l.z); scene.add(p); } }
  const hud = document.getElementById('hud');
  hud.innerHTML = Object.keys(V).map(k => `<button data-v="${k}">${k}</button>`).join('') + '<br>' + stats.map(s => `${s.name}: ${s.draws} draws / ${s.tris} tris`).join('<br>');
  hud.querySelectorAll('button').forEach(b => b.onclick = () => setView(b.dataset.v));
  if (q.has('nohud')) hud.style.display = 'none';
  window.__bt = { stats, setView, scene, camera, renderer, placed, ready: true, render: () => renderer.render(scene, camera) };
  /* render on demand (keeps headless captures responsive) */
  (function loop() { requestAnimationFrame(loop); if (dirty) { dirty = false; renderer.render(scene, camera); } })();
  setInterval(() => dirty = true, 1500);
});
})();
</script>
</body>
</html>
