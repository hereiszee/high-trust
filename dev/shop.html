<!doctype html>
<meta charset="utf-8">
<title>High Trust · Menus test bench</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="../css/hud.css">
<link rel="stylesheet" href="../css/menus.css">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#20262d;color:#fff;font-family:system-ui}
#bg{position:fixed;inset:0;background:#4f7a9a center/cover no-repeat}
.bench{position:fixed;left:50%;bottom:6px;transform:translateX(-50%);z-index:99;display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:96vw;opacity:.35}
.bench:hover{opacity:1}
.bench button{font:600 12px system-ui;color:#fff;background:#000a;border:0;padding:4px 7px;border-radius:3px;cursor:pointer}
body.shot .bench,body.shot #log,body:has(.htm) .bench{display:none}
#log{position:fixed;left:8px;top:8px;z-index:99;font:600 12px system-ui;background:#000a;padding:4px 8px;border-radius:4px;max-width:60vw}
#log:empty{display:none}
</style>
<div id="bg"></div>
<div id="hud"></div>
<div class="bench">
  <button data-open="dadazon">Dadazon</button><button data-open="hardware">Hank's</button><button data-open="mart">Corner Mart</button><button data-open="auto">Dad's Auto</button>
  <button data-locker="loadout">Gun locker</button><button data-locker="attach">Workbench</button>
  <button data-payout="win">Payout: win</button><button data-payout="fail">Payout: fail</button><button data-payout="duke">Payout: Duke</button>
  <button data-preset="fresh">fresh</button><button data-preset="mid">mid</button><button data-preset="rich">rich</button><button data-preset="broke">broke</button>
  <button id="bExport">Export code</button>
</div>
<div id="log"></div>
<script src="../js/hud.js"></script>
<script src="../js/carai.js"></script>
<script src="../js/audio.js"></script>
<script src="../js/save.js"></script>
<script>
/* ?thumbs=3d: three.js + GLTFLoader, then dev-only stand-ins for HT.Guns.model and HT.Vehicles.make (the real modules come from js/guns.js / js/vehicles.js) */
if(new URLSearchParams(location.search).get('thumbs')==='3d')document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"><\/script>');
</script>
<script>
const {Save,Economy,Shop,Locker}=HT;
const q=new URLSearchParams(location.search);if(q.has('shot'))document.body.classList.add('shot');
const tall=innerHeight>innerWidth;document.getElementById('bg').style.backgroundImage=`url(bg_hub_${tall?'tall':'wide'}.jpg)`;
const HUD=HT.HUD.init(document.getElementById('hud'),{touch:matchMedia('(pointer:coarse)').matches});
const log=t=>document.getElementById('log').textContent=t;
const prog={done:Array(9).fill(false),trust:12,trustR:5,act:1,cuffed:0,downed:0,shotSurr:0,missionsRun:0};
Save.load();Save.bindProg(prog);
const hudSync=()=>HUD.update({mode:'hub',cash:Save.data.cash,trust:prog.trust});Save.on('cash',hudSync);hudSync();
const PRESETS={
  fresh:()=>Save.reset(),
  mid:()=>{Save.reset();const d=Save.data,g=d.garage,v=g.vehicles.minivan;Object.assign(prog,{done:[true,true,false,false,false,false,false,false,false],trust:64,trustR:5});d.cash=1940;
    d.owned.guns.push('rifle','revolver');d.owned.att.push('reddot','grip');d.loadout={side:'revolver',p1:'shotgun',p2:'rifle',p3:null};d.attOn.rifle={optic:'reddot',mag:null,under:'grip',muzzle:null};
    d.armory.seen={smg:1,double:1};d.pending=[{kind:'furn',id:'tv'}];v.perf.engine=1;v.perf.tyres=1;g.ownedCos.paint.push('silver');v.paint='silver';g.purchases=3;g.hp.minivan=72;Save.touch('cash','garage')},
  rich:()=>{Save.reset();const d=Save.data,g=d.garage;Object.assign(prog,{done:[true,true,true,true,true,true,false,false,false],trust:88,trustR:46,act:2});d.cash=12450;
    d.owned.guns.push('rifle','smg','hunter','nailer');d.owned.att.push('reddot','grip','extmag','muffler');d.loadout={side:'nailer',p1:'rifle',p2:'hunter',p3:'smg'};
    d.attOn.rifle={optic:'reddot',mag:'extmag',under:'grip',muzzle:'muffler'};d.flags.rangeDay=true;g.util.cargo=true;g.util.rack=true;
    const v=g.vehicles.minivan;v.perf.engine=2;v.perf.tyres=2;v.perf.brakes=1;v.perf.sport=true;v.prot.bullBar=true;v.prot.armor=1;v.paint='wood';v.rims='chrome';g.ownedCos.paint.push('wood');g.ownedCos.rims.push('chrome');
    g.owned.push('pickup');g.vehicles.pickup=HT.Garage.defaultVehicle();g.hp.pickup=120;g.ownedStickers=[2,4];g.stickers=[2,4,null];g.horn='ode';g.ownedHorns.push('ode');g.purchases=9;Save.touch('cash','garage')},
  broke:()=>{Save.reset();Object.assign(prog,{done:[true,false,false,false,false,false,false,false,false],trust:30});Save.data.cash=85;Save.touch('cash')}};
if(q.get('preset'))PRESETS[q.get('preset')]();hudSync();
function payout(kind,instant){
  const r={win:{mission:0,ok:true,cuffs:3,confiscated:2,allyDowns:0,got:4,elapsed:212,exec:0},fail:{mission:1,ok:false,cuffs:1,confiscated:1,exec:1},
    duke:{mission:'duke',ok:true,cuffs:4,confiscated:3,allyDowns:1,bossDone:'cuffed',chaseT:48,vanHp:.93}}[kind];
  const p=Economy.computePayout(r),m=Economy.missionOf(r.mission);
  HUD.show('result',{fail:!r.ok,title:m.title,text:r.ok?(kind==='duke'?"The Duke of Catalytic Converters is in zip-ties and in tears. Earl says it's the best Saturday he's had since the bus route.":"Every package is back on its porch. Mrs. Kowalski cried a little. Gary pretended not to."):'The guys carried you to the van. Rick: "We regroup at halftime."',
    stats:[['Neutralized',String(r.ok?2:3),'Had to'],['Zip-tied',String(r.cuffs),'Second chances'],['Time','4:12'],['Trust',Math.round(m.hood==='river'?prog.trustR:prog.trust)+'%','+12 this job']],canRetry:!r.ok,goLabel:'Head home'});
  const h=Economy.renderPayout(HUD.payoutEl,p,{instant});h.done.then(()=>{Economy.applyPayout(p);log('paid '+p.total)});return h}
document.querySelector('.bench').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;HUD.hide&&HUD.hide();
  if(b.dataset.open)Shop.open({kind:b.dataset.open,onClose:()=>log('shop closed · cash '+Economy.money(Save.data.cash)),onBuy:r=>log((r.use?'used ':'bought ')+r.kind+':'+r.id+' for '+r.price),onPreview:v=>v&&log('preview '+v.type+' '+JSON.stringify(v.opts.upgrades))});
  if(b.dataset.locker)Locker.open({tab:b.dataset.locker,onClose:()=>log('locker closed · '+JSON.stringify(Save.data.loadout))});
  if(b.dataset.preset){PRESETS[b.dataset.preset]();hudSync();log('preset '+b.dataset.preset)}
  if(b.dataset.payout)payout(b.dataset.payout);
  if(b.id==='bExport'){const c=Save.export();log(c.slice(0,60)+'… ('+c.length+' chars)')}});
window.__bench={payout,PRESETS,prog};

/* ---- dev-only stand-ins for the 3D modules, built from the CC0 models in assets/ ---- */
async function threeD(){
  const L=new THREE.GLTFLoader(),load=u=>new Promise((res,rej)=>L.load('../assets/'+u,g=>res(g.scene),undefined,rej));
  const GUNF={pistol:'props/gun_pistol.glb',revolver:'guns2/revolver.glb',nailer:'guns2/nail_gun_pixel.glb',shotgun:'guns2/shotgun_pump_wood.glb',double:'guns2/shotgun_sawedoff_db.glb',
    beanbag:'props/gun_shotgun.glb',rifle:'props/gun_rifle.glb',smg:'guns2/smg.glb',hunter:'guns2/hunting_rifle_scoped.glb'};
  const CARF={minivan:'props/car_van.glb',workvan:'props/car_van.glb',pickup:'props/car_suv.glb',suv:'props/car_suv.glb',sedan:'props/car_sedan.glb',hatch:'props/car_hatchback.glb'};
  const guns={},cars={};
  await Promise.all([...Object.entries(GUNF).map(async([k,f])=>{try{guns[k]=await load(f)}catch(e){}}),...Object.entries(CARF).map(async([k,f])=>{try{cars[k]=await load(f)}catch(e){}})]);
  HT.Guns=HT.Guns||{model(type){const g=guns[type];if(!g)return null;const c=g.clone(true);
    if(type==='beanbag')c.traverse(n=>{if(n.material&&/Wood/i.test(n.material.name||'')){n.material=n.material.clone();n.material.color.set('#f08a2c')}});return c}};
  HT.Vehicles=HT.Vehicles||{make(type,o){const src=cars[type]||cars.minivan;if(!src)return null;const g=src.clone(true),u=(o&&o.upgrades)||{};
    g.traverse(n=>{if(n.isMesh&&/body/i.test(n.name)&&o&&o.color){n.material=n.material.clone();n.material.color.set(o.color).lerp(new THREE.Color('#ffffff'),.25)}});
    const box=new THREE.Box3().setFromObject(g),sz=box.getSize(new THREE.Vector3()),mx=new THREE.MeshStandardMaterial({color:'#2c3036',roughness:.6});
    const fwdX=sz.x>sz.z,len=Math.max(sz.x,sz.z);
    if(u.roofRack==='cargo'){const m=new THREE.Mesh(new THREE.BoxGeometry(fwdX?len*.45:sz.x*.7,sz.y*.14,fwdX?sz.z*.7:len*.45),mx);m.position.set((box.min.x+box.max.x)/2,box.max.y+sz.y*.07,(box.min.z+box.max.z)/2);g.add(m)}
    if(u.lightBar){const m=new THREE.Mesh(new THREE.BoxGeometry(fwdX?len*.08:sz.x*.8,sz.y*.06,fwdX?sz.z*.8:len*.08),new THREE.MeshStandardMaterial({color:'#ffb000',emissive:'#ffb000',emissiveIntensity:.6}));
      m.position.set((box.min.x+box.max.x)/2,box.max.y+sz.y*(u.roofRack==='cargo'?.17:.03),(box.min.z+box.max.z)/2);g.add(m)}
    if(u.bullBar){const m=new THREE.Mesh(new THREE.BoxGeometry(fwdX?.12:sz.x*.9,sz.y*.35,fwdX?sz.z*.9:.12),mx);m.position.set(fwdX?box.max.x+.06:(box.min.x+box.max.x)/2,box.min.y+sz.y*.3,fwdX?(box.min.z+box.max.z)/2:box.max.z+.06);g.add(m)}
    return{group:g,dispose(){}}}};
  Shop.thumbRenderer=Shop.gltfThumbs(THREE,L,{base:'../',kinds:['furn','gun','car','gar','cos']});
}
const ready=(q.get('thumbs')==='3d'&&window.THREE)?threeD():Promise.resolve();
ready.then(()=>{
  if(q.get('open'))Shop.open({kind:q.get('open'),tab:q.get('tab')||undefined,select:q.get('select')||undefined});
  if(q.get('locker'))Locker.open({tab:q.get('locker')});
  if(q.get('payout'))payout(q.get('payout'),q.has('instant'));
  window.__ready=true});
</script>
