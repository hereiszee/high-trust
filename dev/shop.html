<!doctype html>
<meta charset="utf-8">
<title>High Trust · Menus test bench</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Rubik:ital,wght@0,400;0,600;0,800;1,600&display=swap">
<link rel="stylesheet" href="../css/menus.css">
<style>
/* a stand-in for the game behind the menus, plus the game's own .card/.btn styles for the payout demo */
:root{--ink:#16181c;--paper:#f6f1e3;--sun:#ffc94a;--polo:#2f5d9e;--alarm:#e5533d;--leaf:#7ed36b;--display:"Bowlby One","Arial Black",Impact,sans-serif;--body:"Rubik",system-ui,sans-serif;color-scheme:dark}
html,body{margin:0;height:100%;background:#2a3038;color:var(--paper);font-family:var(--body)}
body{background:linear-gradient(#8fb6d4 0 38%,#6d8f6a 38% 40%,#4c5a4a 40% 52%,#5d5f63 52%);overflow:hidden}
.scene{position:fixed;inset:0;filter:blur(3px) saturate(.9)}
.scene i{position:absolute;bottom:48%;width:180px;height:120px;background:#e8d9b0;box-shadow:inset 0 -10px 0 rgba(0,0,0,.1)}
.scene i:before{content:"";position:absolute;left:-14px;right:-14px;top:-50px;height:50px;background:#7b4f3a;clip-path:polygon(50% 0,100% 100%,0 100%)}
.bench{position:fixed;left:16px;top:16px;right:16px;display:flex;flex-wrap:wrap;gap:8px;z-index:1}
.bench button{font:800 12px var(--body);letter-spacing:.06em;text-transform:uppercase;padding:9px 12px;border-radius:6px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.bench button.y{background:var(--sun)}
#log{position:fixed;left:16px;bottom:16px;font:600 12px var(--body);background:rgba(22,24,28,.8);padding:8px 10px;border-radius:6px;max-width:60vw}
.card{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(14,15,18,.72);padding-inline:16px;z-index:5}
.card .in{background:var(--paper);color:var(--ink);max-width:560px;width:100%;padding:26px 26px 24px;border-radius:4px;box-shadow:8px 8px 0 var(--polo);max-height:88%;overflow:auto;position:relative;box-sizing:border-box}
.card .in:before{content:"";position:absolute;left:0;right:0;top:54px;border-top:2px solid rgba(229,83,61,.45)}
.card h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,7vw,42px);line-height:1;margin:8px 0 12px}
.card .who{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--alarm);font-weight:800;height:30px}
.card p{margin:0 0 9px;font-size:15px;line-height:1.48}
.card .meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;background:var(--ink);color:var(--paper);padding:10px 12px;border-radius:4px;margin:14px 0 18px}
.card .meta b{color:var(--sun);text-transform:uppercase;letter-spacing:.08em;font-size:11px;padding-top:2px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{font-family:var(--display);font-size:19px;background:var(--sun);color:var(--ink);border:3px solid var(--ink);border-radius:5px;padding:9px 20px;cursor:pointer;box-shadow:4px 4px 0 var(--ink)}
.btn.ghost{background:transparent;box-shadow:none}
textarea{width:100%;height:70px;font:12px ui-monospace,monospace;box-sizing:border-box}
</style>
<div class="scene"><i style="left:6%"></i><i style="left:30%;background:#c9d3dc"></i><i style="left:58%;background:#d8b7a0"></i><i style="left:82%"></i></div>
<div class="bench">
  <button class="y" data-open="dadazon">Dadazon</button><button class="y" data-open="hardware">Maple Hardware</button><button class="y" data-open="auto">Auto shop</button>
  <button class="y" data-locker="loadout">Gun locker</button><button class="y" data-locker="attach">Workbench</button>
  <button data-payout="win">Payout: win</button><button data-payout="fail">Payout: fail</button>
  <button data-preset="fresh">Preset: fresh</button><button data-preset="mid">Preset: mid</button><button data-preset="rich">Preset: rich</button><button data-preset="broke">Preset: broke</button>
  <button id="bExport">Export code</button>
</div>
<div id="log"></div>
<div class="card" id="cResult" hidden><div class="in"><div class="who" id="rsWho"></div><h2 id="rsTitle"></h2><div id="rsBody"></div>
  <div class="btns"><button class="btn" id="rsGo">Head home</button><button class="btn ghost" id="rsBack">Back to the cul-de-sac</button></div></div></div>
<script src="../js/save.js"></script>
<script>
/* ?thumbs=3d: demo the thumbRenderer hook with real glTF renders of the furniture models (the game can do the same with its own THREE) */
if(new URLSearchParams(location.search).get('thumbs')==='3d'){document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"><\/script>')}
</script>
<script>
const {Save,Economy,Shop,Locker}=HT;
const log=t=>document.getElementById('log').textContent=t;
const prog={done:[false,false,false,false],trust:12,cuffed:0,downed:0,shotSurr:0,missionsRun:0};
Save.load();Save.bindProg(prog);
const PRESETS={
  fresh:()=>Save.reset(),
  mid:()=>{Save.reset();const d=Save.data;Object.assign(prog,{done:[true,true,false,false],trust:64});d.cash=1940;d.owned.guns.push('rifle','revolver');d.owned.att.push('reddot','grip');
    d.loadout={side:'revolver',p1:'shotgun',p2:'rifle'};d.attOn.rifle={optic:'reddot',mag:null,under:'grip',muzzle:null};d.armory.seen={smg:1,double:1};d.pending=[{kind:'furn',id:'tv'}];
    d.vehicle.engine=1;d.vehicle.tyres=1;d.vehicle.cos.paint.push('blue');d.vehicle.paint='blue';Save.touch('cash')},
  rich:()=>{Save.reset();const d=Save.data;Object.assign(prog,{done:[true,true,true,true],trust:88});d.cash=12450;d.owned.guns.push('rifle','smg','hunter','nailer');d.owned.att.push('reddot','grip','extmag','muffler');
    d.loadout={side:'nailer',p1:'rifle',p2:'hunter'};d.attOn.rifle={optic:'reddot',mag:'extmag',under:'grip',muzzle:'muffler'};d.flags.rangeDay=true;d.vehicle.roofBox=1;Save.touch('cash')},
  broke:()=>{Save.reset();Object.assign(prog,{done:[true,false,false,false],trust:30});Save.data.cash=85;Save.touch('cash')}};
const q=new URLSearchParams(location.search);
if(q.get('preset'))PRESETS[q.get('preset')]();
document.querySelector('.bench').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.open)Shop.open({kind:b.dataset.open,onClose:()=>log('shop closed · cash '+Economy.money(Save.data.cash)),onBuy:r=>log('bought '+r.kind+':'+r.id+' for '+r.price+' ('+r.delivered+')')});
  if(b.dataset.locker)Locker.open({tab:b.dataset.locker,onClose:()=>log('locker closed · '+JSON.stringify(Save.data.loadout))});
  if(b.dataset.preset){PRESETS[b.dataset.preset]();log('preset '+b.dataset.preset)}
  if(b.dataset.payout)payout(b.dataset.payout==='win');
  if(b.id==='bExport'){const c=Save.export();log(c.slice(0,60)+'… ('+c.length+' chars)');navigator.clipboard&&navigator.clipboard.writeText(c).catch(()=>{})}});
function payout(ok,instant){
  const p=Economy.computePayout(ok?{mission:0,ok:true,cuffs:3,confiscated:2,allyDowns:0,got:4,elapsed:212,exec:0,trust:prog.trust}:{mission:1,ok:false,cuffs:1,confiscated:1,exec:1,trust:prog.trust});
  document.getElementById('rsWho').textContent=(ok?'Job done · ':'Job failed · ')+(ok?'Chop shop, Industrial Way':'The old duplex on Birch');
  document.getElementById('rsTitle').textContent=ok?'Home in time for dinner.':'The guys carried you to the van.';
  const body=document.getElementById('rsBody');
  body.innerHTML=`<p>${ok?"Gary: Four for four. I'll update the spreadsheet. Mrs. Patel is going to cry.":"Rick: We regroup at halftime."}</p><div class="meta"><b>Neutralized</b><span>${ok?5:2}</span><b>Zip-tied</b><span>${ok?3:1}</span><b>Time</b><span>3:32</span><b>Trust</b><span>${Math.round(prog.trust)}%</span><b>Payout</b><span>${Economy.money(p.total)}</span></div>`;
  document.getElementById('cResult').hidden=false;
  const r=Economy.renderPayout(body,p,{instant});r.done.then(()=>{Economy.applyPayout(p);log('paid '+p.total)});
  document.getElementById('rsGo').onclick=document.getElementById('rsBack').onclick=()=>{r.skip();document.getElementById('cResult').hidden=true};
  return r}
window.__bench={payout,PRESETS,prog};
if(q.get('thumbs')==='3d'&&window.THREE)Shop.thumbRenderer=Shop.gltfThumbs(THREE,new THREE.GLTFLoader(),{base:'../',kinds:['furn']});
if(q.get('open'))Shop.open({kind:q.get('open'),tab:q.get('tab')||undefined,select:q.get('select')||undefined});
if(q.get('locker'))Locker.open({tab:q.get('locker')});
if(q.get('payout'))payout(q.get('payout')==='win',q.has('instant'));
</script>
