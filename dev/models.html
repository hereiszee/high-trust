<!doctype html>
<meta charset="utf-8">
<title>Home models sheet</title>
<style>html,body{margin:0;background:#222;color:#eee;font:11px sans-serif}#l{position:fixed;inset:0;pointer-events:none}#l div{position:absolute;width:160px;text-align:center;text-shadow:0 1px 2px #000}</style>
<div id="l"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
/* dev tool: renders every glb in assets/home as a labelled thumbnail with its bounding box size (m), for checking scale/orientation */
const names=(new URLSearchParams(location.search).get('m')||'').split(',').filter(Boolean);
const R=new THREE.WebGLRenderer({antialias:true});R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.ACESFilmicToneMapping;
R.setSize(innerWidth,innerHeight);document.body.prepend(R.domElement);R.setScissorTest(true);R.setClearColor(0x30343a);
const cols=8,cw=innerWidth/cols,ch=170;const loader=new THREE.GLTFLoader();const items=[];
Promise.all(names.map(n=>new Promise(res=>loader.load('../assets/'+n+'.glb',g=>res({n,g}),undefined,()=>res({n,g:null}))))).then(list=>{
  list.forEach((it,i)=>{const sc=new THREE.Scene();sc.add(new THREE.HemisphereLight(0xffffff,0x555555,1.2));const d=new THREE.DirectionalLight(0xffffff,1.5);d.position.set(2,3,4);sc.add(d);
    let txt=it.n.split('/').pop();
    if(it.g){const o=it.g.scene;sc.add(o);const b=new THREE.Box3().setFromObject(o),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());
      txt+=`<br>${s.x.toFixed(2)} x ${s.y.toFixed(2)} x ${s.z.toFixed(2)}<br>min ${b.min.x.toFixed(2)},${b.min.y.toFixed(2)},${b.min.z.toFixed(2)}`;
      const ax=new THREE.AxesHelper(Math.max(s.x,s.y,s.z)*.6);sc.add(ax);
      const cam=new THREE.PerspectiveCamera(35,cw/ch,.01,100);const r=Math.max(s.x,s.y,s.z);cam.position.copy(c).add(new THREE.Vector3(r*1.1,r*.8,r*1.9));cam.lookAt(c);items.push({sc,cam,i})}
    else txt+='<br>FAILED';
    const el=document.createElement('div');el.style.left=(i%cols)*cw+'px';el.style.top=(Math.floor(i/cols)*ch+2)+'px';el.style.width=cw+'px';el.innerHTML=txt;document.getElementById('l').appendChild(el)});
  for(const it of items){const x=(it.i%cols)*cw,y=innerHeight-(Math.floor(it.i/cols)+1)*ch;R.setViewport(x,y,cw,ch);R.setScissor(x,y,cw,ch);R.render(it.sc,it.cam)}
  window.__ready=true});
</script>
