<!doctype html>
<meta charset="utf-8">
<title>High Trust · FX test bench</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Rubik:wght@400;600;800&display=swap">
<style>
:root{--ink:#16181c;--paper:#f6f1e3;--sun:#ffc94a;--display:"Bowlby One","Arial Black",Impact,sans-serif;--body:"Rubik",system-ui,sans-serif;color-scheme:dark}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--paper);font-family:var(--body)}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#ui{position:fixed;left:12px;top:12px;width:230px;max-height:calc(100% - 24px);overflow:auto;background:rgba(14,16,20,.82);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:10px 10px 12px;z-index:20;font-size:12px}
#ui h1{font-family:var(--display);font-size:16px;margin:0 0 6px;color:var(--sun);letter-spacing:.02em}
#ui h2{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.6;margin:10px 0 4px}
#ui .row{display:flex;flex-wrap:wrap;gap:4px}
#ui button{font:600 11px var(--body);background:#2a2e36;color:var(--paper);border:1px solid #3c424d;border-radius:6px;padding:5px 7px;cursor:pointer}
#ui button:hover{background:#37404c}#ui button.on{background:var(--sun);color:var(--ink);border-color:var(--sun)}
#ui select{font:600 11px var(--body);background:#2a2e36;color:var(--paper);border:1px solid #3c424d;border-radius:6px;padding:4px}
#stats{position:fixed;right:12px;bottom:10px;font:11px ui-monospace,monospace;opacity:.7;z-index:20;text-align:right;white-space:pre}
#hint{position:fixed;right:12px;top:12px;font-size:12px;opacity:.75;z-index:20;text-align:right}
body.shot #ui,body.shot #stats,body.shot #hint{display:none}
</style>
<div id="ui">
  <h1>FX bench</h1>
  <h2>Gun (click scene to shoot)</h2>
  <div class="row" id="guns"></div>
  <div class="row" style="margin-top:4px"><button id="fp">First person</button><button id="auto">Auto fire</button></div>
  <h2>Effects</h2>
  <div class="row">
    <button data-d="flashes">Muzzle flashes</button><button data-d="fpflash">FP flash</button><button data-d="tracers">Tracers</button>
    <button data-d="impacts">Impacts</button><button data-d="holes">Decals close</button><button data-d="shells">Shells</button>
    <button data-d="explosion">Explosion</button><button data-d="skid">Skids</button><button data-d="ambient">Ambient</button>
    <button data-d="interact">Glow / beacon / +TRUST</button><button data-d="damage">Damage UI</button><button data-d="motes">Shed motes</button><button data-d="flies">Flies</button><button data-d="cloth">Cloth hits</button>
  </div>
  <h2>Camera</h2>
  <div class="row"><button data-c="wide">Wide</button><button data-c="walls">Walls</button><button data-c="yard">Yard</button><button data-c="close">Close</button></div>
  <h2>Quality</h2>
  <select id="q"><option>low</option><option>med</option><option selected>high</option></select>
  <button id="clr">Clear</button>
</div>
<div id="hint">drag to look · click to shoot</div>
<div id="stats"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/FXAAShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="../js/fx.js"></script>
<script>
(()=>{'use strict';
const V3=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z),$=id=>document.getElementById(id),rnd=(a,b)=>a+Math.random()*(b-a);
const FX=HT.FX;
/* ---- renderer: same filmic setup as the game (sRGB, ACES, HDR IBL, half-float composer, bloom, grade) */
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(72,1,.05,420);camera.rotation.order='YXZ';scene.add(camera);
const SUN_DIR=V3(.55,.74,.38).normalize();
const hemi=new THREE.HemisphereLight(0xcfe3ff,0x6b5a40,.2);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff0d8,2.1);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-18,right:18,top:18,bottom:-18,near:1,far:120});
sun.shadow.bias=-.0004;sun.shadow.normalBias=.025;sun.position.copy(SUN_DIR).multiplyScalar(60);scene.add(sun,sun.target);
scene.fog=new THREE.Fog(0xb9cbe0,70,260);
const lin=c=>new THREE.Color(c).convertSRGBToLinear();
/* sky dome + HDR environment */
const skyMat=new THREE.MeshBasicMaterial({color:0xbfd8ef,side:THREE.BackSide,fog:false,toneMapped:false,depthWrite:false});
const sky=new THREE.Mesh(new THREE.SphereGeometry(380,48,24),skyMat);sky.scale.z=-1;sky.renderOrder=-10;scene.add(sky);
const texL=new THREE.TextureLoader();
texL.load('../assets/sky/sky_2k.jpg',t=>{t.encoding=THREE.sRGBEncoding;skyMat.map=t;skyMat.color.set(0xffffff);skyMat.needsUpdate=true});
let envReady=false;
new THREE.RGBELoader().setDataType(THREE.UnsignedByteType).load('../assets/sky/sky_1k.hdr',h=>{const pm=new THREE.PMREMGenerator(renderer);
  /* same treatment as the game: clip the sun, darken below the horizon */
  const{width:W,height:H,data:D}=h.image;for(let y=0;y<H;y++){const k=Math.min(1,Math.max(0,(y-H/2)/(H*.04))),gr=[.16,.15,.11];for(let x=0;x<W;x++){const o=(y*W+x)*4,s=Math.pow(2,D[o+3]-128)/255;let c=[D[o]*s,D[o+1]*s,D[o+2]*s];
    const pk=Math.max(...c);if(pk>4)c=c.map(v=>v*4/pk);if(k>0)c=c.map((v,j)=>v*(1-k)+v*gr[j]*k);const m=Math.max(...c);if(m<1e-6){D[o]=D[o+1]=D[o+2]=D[o+3]=0;continue}
    const e=Math.ceil(Math.log2(m)),sc=255/Math.pow(2,e);D[o]=Math.min(255,Math.round(c[0]*sc));D[o+1]=Math.min(255,Math.round(c[1]*sc));D[o+2]=Math.min(255,Math.round(c[2]*sc));D[o+3]=e+128}}
  h.needsUpdate=true;scene.environment=pm.fromEquirectangular(h).texture;pm.dispose();envReady=true});
/* ---- materials */
function pbr(n,rep,o={}){const m=new THREE.MeshStandardMaterial({color:o.color||0xffffff,roughness:1,metalness:o.metal||0});
  const L=(s,srgb)=>{const t=texL.load('../assets/tex/'+n+'_'+s+'.jpg');t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);t.anisotropy=8;if(srgb)t.encoding=THREE.sRGBEncoding;return t};
  m.map=L('col',1);m.normalMap=L('nrm');m.roughnessMap=L('rgh');return m}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(60,60),pbr('concfloor',[15,15]));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;ground.userData.surface='concrete';scene.add(ground);
const grass=new THREE.Mesh(new THREE.PlaneGeometry(10,12),pbr('grass',[4,5]));grass.rotation.x=-Math.PI/2;grass.position.set(-12,.01,3);grass.receiveShadow=true;grass.userData.surface='grass';scene.add(grass);
const dirt=new THREE.Mesh(new THREE.PlaneGeometry(6,6),new THREE.MeshStandardMaterial({color:lin('#6b5440'),roughness:1}));dirt.rotation.x=-Math.PI/2;dirt.position.set(12,.01,3);dirt.receiveShadow=true;dirt.userData.surface='dirt';scene.add(dirt);
const targets=[ground,grass,dirt];
function wall(x,w,mat,surf,h=2.6,d=.3){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,h/2,-3);m.castShadow=m.receiveShadow=true;m.userData.surface=surf;scene.add(m);targets.push(m);return m}
wall(-7.5,3,pbr('sidewalk',[1.5,1.3]),'concrete');wall(-4.5,3,pbr('brick',[1.5,1.3]),'brick');wall(-1.5,3,pbr('siding',[1.5,1.3]),'wood');wall(1.5,3,pbr('metal',[1.5,1.3],{metal:.6}),'metal');
wall(4.5,3,pbr('plaster',[1.5,1.3]),'plaster');
const glassM=new THREE.MeshStandardMaterial({color:0xcfe6ea,roughness:.05,metalness:0,transparent:true,opacity:.22,envMapIntensity:1.5});
const frameM=new THREE.MeshStandardMaterial({color:lin('#e8e4da'),roughness:.6});
const gl_=wall(7.5,2.8,glassM,'glass',2.2,.02);gl_.position.y=1.4;gl_.castShadow=false;
for(const[x,y,w,h]of[[7.5,.25,3,.1],[7.5,2.55,3,.1],[6.05,1.4,.1,2.4],[8.95,1.4,.1,2.4]]){const f=new THREE.Mesh(new THREE.BoxGeometry(w,h,.12),frameM);f.position.set(x,y,-3);f.castShadow=true;scene.add(f)}
/* a shed behind the walls: dark interior, sun through a roof hatch, for dust motes in a light shaft */
const shed=new THREE.Group();shed.position.set(0,0,-12);scene.add(shed);
const shedM=pbr('woodfloor',[2,1.5]),shedW=pbr('plaster',[2,1.2]);
for(const[x,y,z,w,h,d,m]of[[0,1.6,-3,8,3.2,.2,shedW],[-4,1.6,0,.2,3.2,6,shedW],[4,1.6,0,.2,3.2,6,shedW],[-2.4,1.6,3,3.2,3.2,.2,shedW],[2.4,1.6,3,3.2,3.2,.2,shedW],[0,2.85,3,1.6,.7,.2,shedW],
  [-2.3,3.25,0,3.6,.12,6.2,shedM],[2.3,3.25,0,3.6,.12,6.2,shedM],[0,3.25,-2.05,1.1,.12,2.1,shedM],[0,3.25,1.6,1.1,.12,2.8,shedM],[0,.01,0,8,.02,6,shedM]]){
  const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);b.position.set(x,y,z);b.castShadow=b.receiveShadow=true;shed.add(b);targets.push(b)}
/* ---- props */
const gltf=new THREE.GLTFLoader();const props={};
function load(n,url,cb){gltf.load(url,g=>{g.scene.traverse(o=>{if(o.isMesh){o.castShadow=o.receiveShadow=true}});props[n]=g.scene;cb&&cb(g.scene,g)},undefined,e=>console.warn('load fail',n))}
load('car','../assets/props/car_sedan.glb',s=>{s.position.set(-10.5,0,7.5);s.rotation.y=-.9;scene.add(s);s.traverse(o=>{if(o.isMesh){o.userData.surface='vehicle';targets.push(o)}})});
load('barrel','../assets/props/barrel_red.glb',s=>{s.position.set(2,0,4);scene.add(s)});
load('crate','../assets/props/crate.glb',s=>{s.position.set(-3,0,3);scene.add(s);props.pistol&&placeOnCrate()});
load('pistol','../assets/guns/ph_pistol.glb',s=>{s.position.set(-3,.0,3);s.scale.setScalar(1);scene.add(s);props.crate&&placeOnCrate()});
function placeOnCrate(){const b=new THREE.Box3().setFromObject(props.crate);props.pistol.position.set(-3,b.max.y+.02,3);props.pistol.rotation.set(0,.6,0)}
load('trash','../assets/props/trashbag.glb',s=>{s.position.set(6,0,3.5);scene.add(s)});
let dad=null,mixer=null;
load('dad','../assets/people/rocketbox/dad_player.glb',(s,g)=>{s.position.set(9,0,1);s.rotation.y=-.6;scene.add(s);dad=s;s.traverse(o=>{if(o.isMesh){o.userData.surface='cloth';targets.push(o)}});
  if(g.animations.length){mixer=new THREE.AnimationMixer(s);const c=g.animations.find(a=>/idle/i.test(a.name))||g.animations[0];mixer.clipAction(c).play()}});
/* ---- post: like RENDER in index.html, with the FX grade hook */
const FSV='varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}';
const GradeShader={uniforms:Object.assign({tDiffuse:{value:null},time:{value:0},res:{value:new THREE.Vector2(1,1)},vig:{value:.28},grain:{value:.028},contrast:{value:.22},sat:{value:1.06}},FX.GRADE.uniforms),
  vertexShader:FSV,fragmentShader:`varying vec2 vUv;uniform sampler2D tDiffuse;uniform float time,vig,grain,contrast,sat;uniform vec2 res;
  ${FX.GRADE.glsl}
  vec3 toSRGB(vec3 c){return mix(c*12.92,1.055*pow(c,vec3(.41666))-.055,step(.0031308,c));}
  void main(){vec3 c=clamp(fxSample(tDiffuse,vUv),0.,1.);float l=dot(c,vec3(.2126,.7152,.0722));
    c=max(mix(vec3(l),c,sat),0.);c*=mix(vec3(.95,.99,1.07),vec3(1.05,1.,.92),smoothstep(.04,.5,l));c=fxGrade(c,vUv);
    c=toSRGB(clamp(c,0.,1.));c=mix(c,c*c*(3.-2.*c),contrast);
    vec2 d=(vUv-.5)*vec2(res.x/res.y,1.);c*=1.-vig*smoothstep(.25,.95,length(d));
    float n=fract(sin(dot(floor(vUv*res)+fract(time)*vec2(37.,91.),vec2(12.9898,78.233)))*43758.5453);c+=(n-.5)*grain*(1.-l*.5);
    gl_FragColor=vec4(c,1.);}`};
const rt=new THREE.WebGLRenderTarget(2,2,{type:THREE.HalfFloatType,minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,format:THREE.RGBAFormat});
const composer=new THREE.EffectComposer(renderer,rt);composer.addPass(new THREE.RenderPass(scene,camera));
const bloom=new THREE.UnrealBloomPass(new THREE.Vector2(256,256),.38,.5,.9);const bs=bloom.setSize.bind(bloom);bloom.setSize=(w,h)=>bs(Math.max(4,w>>1),Math.max(4,h>>1));composer.addPass(bloom);
const grade=new THREE.ShaderPass(GradeShader);composer.addPass(grade);const fxaa=new THREE.ShaderPass(THREE.FXAAShader);composer.addPass(fxaa);
function resize(){const pr=renderer.getPixelRatio();renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();composer.setPixelRatio(pr);composer.setSize(innerWidth,innerHeight);
  grade.uniforms.res.value.set(innerWidth*pr,innerHeight*pr);fxaa.uniforms.resolution.value.set(1/(innerWidth*pr),1/(innerHeight*pr))}
addEventListener('resize',resize);resize();
/* ---- FX */
FX.init({scene,camera,renderer,quality:'high'});FX.bindGrade(grade.uniforms);
/* ---- camera */
const cam={pos:V3(0,1.7,7),yaw:0,pitch:-.08};
const CAMS={wide:[V3(0,2.4,9),0,-.14],walls:[V3(0,1.6,2.6),0,-.02],yard:[V3(-4,2.2,12),.25,-.12],close:[V3(-7.5,1.3,-2.25),0,0]};
function setCam(p,yaw,pitch){cam.pos.copy(p);cam.yaw=yaw;cam.pitch=pitch}
function placeCam(){camera.position.copy(cam.pos);camera.rotation.set(cam.pitch,cam.yaw,0);camera.updateMatrixWorld(true)}
let drag=null;renderer.domElement.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,moved:0}});
addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.moved+=Math.abs(dx)+Math.abs(dy);drag.x=e.clientX;drag.y=e.clientY;cam.yaw-=dx*.004;cam.pitch=Math.max(-1.2,Math.min(1.2,cam.pitch-dy*.004))});
addEventListener('pointerup',e=>{if(drag&&drag.moved<6)shootAtScreen(e.clientX,e.clientY);drag=null});
addEventListener('keydown',e=>{const f=V3(-Math.sin(cam.yaw),0,-Math.cos(cam.yaw)),r=V3(Math.cos(cam.yaw),0,-Math.sin(cam.yaw));
  if(e.key==='w')cam.pos.addScaledVector(f,.5);if(e.key==='s')cam.pos.addScaledVector(f,-.5);if(e.key==='a')cam.pos.addScaledVector(r,-.5);if(e.key==='d')cam.pos.addScaledVector(r,.5)});
/* ---- shooting */
const GUNS={pistol:{rec:.02,sh:.08},revolver:{rec:.045,sh:.16},smg:{rec:.012,sh:.05,auto:.07},rifle:{rec:.016,sh:.07,auto:.105},hunter:{rec:.06,sh:.2},shotgun:{rec:.06,sh:.25,pel:9},double:{rec:.08,sh:.3,pel:10},beanbag:{rec:.04,sh:.15},nailer:{rec:.004,sh:.02,auto:.075}};
let gun='rifle',fp=false;const ray=new THREE.Raycaster();
function muzzlePos(){if(fp)return V3(.24,-.16,-1.1).applyQuaternion(camera.quaternion).add(camera.position);return V3(.35,-.3,-.9).applyQuaternion(camera.quaternion).add(camera.position)}
function fireAlong(dir,g=gun){const G=GUNS[g];const mz=muzzlePos();FX.muzzleFlash(mz,dir,{type:g,firstPerson:fp});
  const eject=V3(1,.6,.2).applyQuaternion(camera.quaternion).normalize();if(g!=='revolver'&&g!=='nailer'&&g!=='double')FX.shell(mz.clone().addScaledVector(dir,-.25),eject,g);
  for(let k=0;k<(G.pel||1);k++){const d=dir.clone();if(G.pel)d.add(V3(rnd(-1,1),rnd(-1,1),rnd(-1,1)).multiplyScalar(.04)).normalize();
    ray.set(camera.position,d);ray.far=200;const h=ray.intersectObjects(targets,true)[0];const end=h?h.point:camera.position.clone().addScaledVector(d,200);
    if(g!=='nailer')FX.tracer(mz,end,{trail:G.pel?0:undefined});
    if(h){if(g==='nailer')FX.impact(h.point,worldNormal(h),'nail');else FX.hit(h,{big:g==='hunter'})}}
  FX.shake(G.sh,{kick:G.rec})}
function worldNormal(h){return h.face.normal.clone().transformDirection(h.object.matrixWorld)}
function shootAtScreen(x,y){placeCam();const v=V3(x/innerWidth*2-1,-(y/innerHeight)*2+1,.5).unproject(camera).sub(camera.position).normalize();fireAlong(v)}
let autoT=0,auto=false;
/* ---- demo scenes for buttons and the screenshot script */
const handles=[];
function dropHandles(){while(handles.length){const h=handles.pop();h&&h.remove&&h.remove()}FX.ambient(null)}
const D={
  flashes(){setCam(V3(0,1.45,1.6),0,-.02);placeCam();const types=['pistol','revolver','smg','rifle','hunter','shotgun','double','beanbag'];
    types.forEach((t,i)=>{const p=V3(-2.1+i*.6,1.35+Math.sin(i)*.02,-.6);FX.muzzleFlash(p,V3(.15,0,-1).normalize().applyAxisAngle(V3(0,1,0),-.55),{type:t})});},
  fpflash(){setCam(V3(-6,1.65,6),0,-.05);fp=true;placeCam();fireAlong(V3(0,0,-1).applyQuaternion(camera.quaternion),'rifle');setTimeout(()=>{},0)},
  tracers(){setCam(V3(0,1.6,8),-.2,-.04);placeCam();for(let i=0;i<7;i++){const a=V3(-14,1.2+i*.12,-1+i*.4),b=V3(14,1.3+i*.1,-2+i*.3);FX.tracer(a,b,{enemy:i%3===1,ally:i%3===2,trail:i===0?1:0})}
    for(let i=0;i<4;i++){FX.tracer(V3(12,1.5,-10+i),V3(-12,1.8,6+i*.5),{enemy:true})}},
  impacts(){setCam(V3(0,1.55,3.8),0,-.05);placeCam();const xs=[-7.5,-4.5,-1.5,1.5,4.5,7.5];const sf=['concrete','brick','wood','metal','plaster','glass'];
    xs.forEach((x,i)=>{for(let k=0;k<5;k++)FX.impact(V3(x+rnd(-1,1),rnd(.6,2.1),-3+.16*(sf[i]==='glass'?0:1)+(sf[i]==='glass'?.012:0)),V3(0,0,1),sf[i],{big:k===0})})},
  holes(){setCam(V3(-6,1.4,-1.9),.0,-.04);placeCam();const sf=[['concrete',-7.5],['brick',-4.5],['wood',-1.5],['metal',1.5],['plaster',4.5]];
    for(const[s,x]of sf)for(let k=0;k<8;k++)FX.impact(V3(x+rnd(-1.3,1.3),rnd(.5,2.3),-2.85),V3(0,0,1),s,{});
    for(let k=0;k<5;k++)FX.impact(V3(7.5+rnd(-1,1),rnd(.6,2.1),-2.99),V3(0,0,1),'glass',{});for(let k=0;k<6;k++)FX.impact(V3(1.5+rnd(-1,1),rnd(.5,2),-2.85),V3(0,0,1),'nail',{})},
  shells(){setCam(V3(.2,.9,1.9),-.25,-.42);placeCam();for(let i=0;i<14;i++){const g=['pistol','rifle','shotgun','hunter','beanbag'][i%5];FX.shell(V3(rnd(-.4,.4),1.2,rnd(-.2,.2)),V3(1,.4,rnd(-.3,.3)).normalize(),g)}},
  explosion(){setCam(V3(2,2.2,14),0,-.05);placeCam();if(props.barrel)props.barrel.visible=false;FX.explosion(V3(2,.5,4),1)},
  skid(){setCam(V3(-2,4.5,12),.1,-.45);placeCam();let t=0;const run=()=>{t+=1/30;const a=t*1.1;const c=V3(-2+Math.sin(a)*5,0,6+Math.cos(a)*3);const h=V3(Math.cos(a)*5,0,-Math.sin(a)*3).normalize();
      const r=V3(-h.z,0,h.x);for(const[s,f]of[[-1,-1.3],[1,-1.3],[-1,1.3],[1,1.3]])FX.skid(c.clone().addScaledVector(r,s*.8).addScaledVector(h,f),h,f<0?1:.6);return t<3.4};return run},
  ambient(){setCam(V3(-5.2,1.6,9.2),.6,-.12);placeCam();FX.ambient({leaves:true,pollen:true,density:1.5});
    handles.push(FX.emitter('flies',{pos:V3(6,.45,3.5),count:7}));
    handles.push(FX.emitter('sprinkler',{pos:V3(-9.5,0,3),radius:4,yaw:-1.2,arc:1}));
    if(props.car)handles.push(FX.emitter('exhaust',{object:props.car,offset:[.4,.3,-2.2],dir:[0,0,-1],intensity:.6}))},
  interact(){setCam(V3(1.5,1.8,8),-.05,-.1);placeCam();if(props.pistol)handles.push(FX.pickupGlow(props.pistol,{}));
    handles.push(FX.beacon(V3(4,0,1),{}));if(dad)handles.push(FX.pickupGlow(dad,{color:'#7ed36b',intensity:1.6,sparkle:false}));
    FX.trustPop(V3(9,1.9,1),'+TRUST',{sub:'zip-tied'});handles.push(FX.highlight(props.barrel,true,{color:'#9fd4ff',intensity:1.4}))},
  motes(){setCam(V3(2.2,1.5,-9.8),.45,.02);placeCam();handles.push(FX.emitter('shaft',{origin:[0,3.2,-12.4],size:[1.1,1.2],dir:[.55,.74,.38],length:4.3,count:120}))},
  flies(){setCam(V3(5.2,1,5.6),-.35,-.25);placeCam();handles.push(FX.emitter('flies',{pos:V3(6,.45,3.5),count:8}))},
  damage(){setCam(V3(0,1.7,7),0,-.08);placeCam();FX.damageIndicator(-1.1);FX.damageIndicator(2.6,.7);FX.hitPulse(.8);FX.setHealth(.18);FX.suppress(.8)},
  cloth(){setCam(V3(8.6,1.45,3.4),-.1,-.05);placeCam();for(let k=0;k<4;k++){FX.impact(V3(9+rnd(-.15,.15),rnd(.9,1.4),1.15),V3(-.4,0,1).normalize(),'cloth',{color:[.35,.45,.6]})}}
};
let runner=null;
function demo(n){FX.clear();dropHandles();FX.setHealth(1);fp=false;if(props.barrel)props.barrel.visible=true;$('fp').classList.remove('on');const r=D[n]();runner=typeof r==='function'?r:null}
/* ---- UI */
for(const g in GUNS){const b=document.createElement('button');b.textContent=g;b.onclick=()=>{gun=g;[...$('guns').children].forEach(x=>x.classList.toggle('on',x===b))};if(g===gun)b.classList.add('on');$('guns').appendChild(b)}
$('fp').onclick=()=>{fp=!fp;$('fp').classList.toggle('on',fp)};$('auto').onclick=()=>{auto=!auto;$('auto').classList.toggle('on',auto)};
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>demo(b.dataset.d));
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const c=CAMS[b.dataset.c];setCam(c[0],c[1],c[2])});
$('q').onchange=()=>FX.setQuality($('q').value);$('clr').onclick=()=>{FX.clear();dropHandles();FX.setHealth(1)};
/* ---- loop */
let paused=false,last=performance.now(),t0=performance.now();
function tick(dt){if(runner&&!runner())runner=null;if(mixer)mixer.update(dt);
  if(auto){autoT-=dt;if(autoT<=0){const G=GUNS[gun];autoT=G.auto||.35;placeCam();fireAlong(V3(rnd(-.03,.03),rnd(-.02,.03),-1).normalize().applyQuaternion(camera.quaternion))}}
  placeCam();FX.update(dt)}
function draw(){placeCam();FX.applyCamera(camera);sky.position.copy(camera.position);grade.uniforms.time.value=(performance.now()-t0)/1000;composer.render();
  const s=FX.stats();$('stats').textContent=`additive ${s.additive} · smoke ${s.smoke} · decals ${s.decals} · bits ${s.chips+s.splinters+s.shards+s.flakes} · brass ${s.brass+s.hulls}`}
function frame(now){if(paused)return;const dt=Math.min(.05,(now-last)/1000);last=now;tick(dt);draw();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
window.demo={FX,D,demo,props,setCam,placeCam,fireAlong,setGun:g=>gun=g,setFp:v=>fp=v,camera,scene,get envReady(){return envReady},
  pause(){paused=true},resume(){paused=false;last=performance.now();requestAnimationFrame(frame)},
  step(n,dt=1/60){for(let i=0;i<n;i++)tick(dt);draw()},tickOnly(n,dt=1/60){for(let i=0;i<n;i++)tick(dt)},
  loaded(){return envReady&&['car','barrel','crate','pistol','trash','dad'].every(k=>props[k])}};
})();
</script>
