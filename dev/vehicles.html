<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vehicle Lineup</title>
<style>
  :root { --bg: #c9d6e2; --fg: #111; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1b1f24; --fg: #eee; } }
  :root[data-theme="dark"] { --bg: #1b1f24; --fg: #eee; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
  #hud { position: fixed; left: 8px; top: 8px; background: rgba(0,0,0,.55); color: #fff; padding: 6px 10px; border-radius: 6px; max-width: calc(100vw - 32px); }
  #hud button, #hud select { margin: 2px; font: inherit; }
  #hud.hide { display: none; }
</style>
</head>
<body>
<div id="hud">loading…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="../js/vehicles.js"></script>
<script>
(() => {
'use strict';
const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, .1, 600);
const controls = new THREE.OrbitControls(camera, renderer.domElement); controls.enableDamping = true;
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
const lin = c => new THREE.Color(c).convertSRGBToLinear();
const hemi = new THREE.HemisphereLight(0xcfe3ff, 0x6b5a40, .2); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d8, 2.1); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 120 }); sun.shadow.bias = -.0003; sun.shadow.normalBias = .02;
sun.position.set(22, 30, 14); scene.add(sun, sun.target);

const tl = new THREE.TextureLoader();
const texSet = (n, rep) => { const o = {}; for (const [k, s, srgb] of [['map', 'col', 1], ['normalMap', 'nrm', 0], ['roughnessMap', 'rgh', 0]]) { const t = tl.load('../assets/tex/' + n + '_' + s + '.jpg'); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep); t.anisotropy = 8; if (srgb) t.encoding = THREE.sRGBEncoding; o[k] = t; } return o; };
const ground = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshStandardMaterial(Object.assign({ roughness: 1 }, texSet('asphalt', 40))));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
/* parking-bay lines */
const lineM = new THREE.MeshStandardMaterial({ color: lin('#e8e4d8'), roughness: .8 });
for (let i = -4; i <= 4; i++) { const l = new THREE.Mesh(new THREE.PlaneGeometry(.12, 6.2), lineM); l.rotation.x = -Math.PI / 2; l.position.set(i * 3.4, .005, 0); l.receiveShadow = true; scene.add(l); }

const ready = new Promise(res => new THREE.RGBELoader().setDataType(THREE.UnsignedByteType).load('../assets/sky/sky_1k.hdr', h => {
  const pm = new THREE.PMREMGenerator(renderer);
  const { width: W, height: H, data: D } = h.image, CLIP = 4;
  for (let y = 0; y < H; y++) { const k = Math.min(1, Math.max(0, (y - H / 2) / (H * .04))), gr = [.16, .15, .11];
    for (let x = 0; x < W; x++) { const o = (y * W + x) * 4, s = Math.pow(2, D[o + 3] - 128) / 255; let c = [D[o] * s, D[o + 1] * s, D[o + 2] * s];
      const pk = Math.max(...c); if (pk > CLIP) c = c.map(v => v * CLIP / pk); if (k > 0) c = c.map((v, j) => v * (1 - k) + v * gr[j] * k);
      const m = Math.max(...c); if (m < 1e-6) { D[o] = D[o + 1] = D[o + 2] = D[o + 3] = 0; continue; }
      const e = Math.ceil(Math.log2(m)), sc = 255 / Math.pow(2, e); D[o] = Math.min(255, Math.round(c[0] * sc)); D[o + 1] = Math.min(255, Math.round(c[1] * sc)); D[o + 2] = Math.min(255, Math.round(c[2] * sc)); D[o + 3] = e + 128; } }
  h.needsUpdate = true; scene.environment = pm.fromEquirectangular(h).texture; pm.dispose(); res();
}, undefined, () => res()));
tl.load('../assets/sky/sky_2k.jpg', t => { t.encoding = THREE.sRGBEncoding; t.mapping = THREE.EquirectangularReflectionMapping; scene.background = t; });

HT.Vehicles.init({});
const COLS = { minivan: '#35577d', sedan: '#8a2f2a', suv: '#3d4a3a', hatch: '#d8d4c8', pickup: '#1f2226', workvan: '#f2f2ee' };
let cars = [];
function clear() { for (const c of cars) { scene.remove(c); c.userData.dispose(); } cars = []; }
function stats(v) { return HT.Vehicles.stats(v); }
const api = window.VT = {
  ready,
  lineup(ups) {
    clear(); const types = HT.Vehicles.TYPES;
    types.forEach((t, i) => { const v = HT.Vehicles.make(t, { color: COLS[t], upgrades: ups || {} }); v.position.set((i - (types.length - 1) / 2) * 3.4, 0, 0); v.rotation.y = -Math.PI / 2 + .0; scene.add(v); cars.push(v); });
    return cars.map(c => Object.assign({ type: c.userData.type }, stats(c)));
  },
  single(type, ups, color) { clear(); const v = HT.Vehicles.make(type, { color: color || COLS[type], upgrades: ups || {} }); scene.add(v); cars.push(v); return Object.assign({ type }, stats(v), { size: v.userData.size }); },
  pair(type, upsA, upsB, color) { clear(); for (const [k, u] of [[-1.4, upsA], [1.4, upsB]]) { const v = HT.Vehicles.make(type, { color: color || COLS[type], upgrades: u }); v.position.z = k * 1.0; v.position.x = k * 1.6; scene.add(v); cars.push(v); } },
  cam(px, py, pz, tx, ty, tz, fov) { camera.position.set(px, py, pz); controls.target.set(tx, ty, tz); if (fov) { camera.fov = fov; camera.updateProjectionMatrix(); } controls.update(); },
  drive(o, n) { for (let i = 0; i < (n || 1); i++) for (const c of cars) HT.Vehicles.update(c, Object.assign({ dt: 1 / 30 }, o)); },
  hud(on) { document.getElementById('hud').classList.toggle('hide', !on); },
  render() { renderer.render(scene, camera); },
  cars: () => cars, scene, camera
};
const hud = document.getElementById('hud');
ready.then(() => {
  const mode = q.get('mode') || 'lineup';
  if (mode === 'lineup') { const s = api.lineup(); api.cam(0, 7, 15, 0, .6, 0); hud.innerHTML = 'All six types. Drag to orbit. ' + s.map(x => `${x.type}: ${x.tris} tris / ${x.calls} calls`).join(' · '); }
  else { api.single(q.get('type') || 'minivan', JSON.parse(q.get('up') || '{}')); api.cam(5, 1.8, 5, 0, .8, 0); }
  const sel = document.createElement('select'); for (const t of HT.Vehicles.TYPES) sel.add(new Option(t, t)); hud.append(document.createElement('br'), sel);
  const b = (label, f) => { const e = document.createElement('button'); e.textContent = label; e.onclick = f; hud.append(e); };
  b('Stock', () => api.single(sel.value, {})); b('All upgrades', () => api.single(sel.value, { rims: 'alloy', roofRack: 'cargo', bullBar: true, lightBar: 'amber', tint: .7, spoiler: true }));
  b('Black rims + wood', () => api.single(sel.value, { rims: 'black', paint: 'wood' })); b('Lineup', () => api.lineup());
  b('Lights', () => api.drive({ headlights: true, braking: true, speed: 0 }));
  let last = performance.now();
  (function loop(t) { requestAnimationFrame(loop); const dt = Math.min(.1, (t - last) / 1000); last = t; controls.update(); renderer.render(scene, camera); })(last);
});
})();
</script>
</body>
</html>
